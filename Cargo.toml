[package]
name = "kube-secrets"
version = "0.6.0"
edition = "2024"
authors = ["Frank Wiles <frank@revsys.com>"]
description = "Command line utility to quickly display useful secrets in a Kubernetes namespace"
license = "BSD-3-Clause"
homepage = "https://github.com/frankwiles/kube-secrets"
keywords = ["kubernetes", "k8s", "kube"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "secrets"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.1", features = ["full"] }
anyhow = "1.0.102"
kube = { version = "3.1.0", features = ["socks5"] }
kube-runtime = "3.1.0"
k8s-openapi = { version = "0.27.1", default-features = false, features = ["v1_35"] }
colorful = "0.3.2"
